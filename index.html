<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender</title>
<meta name="theme-color" content="#ffffff" id="tc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
/* Varm, modern palett: varmgrå mark, varmsvart bläck, honung för idag, röd för röda dagar */
:root{
  --bg:#F6F3F0;--raise:#FFFFFF;--card:#EFEAE5;--soft:#F9F7F5;
  --fg:#2A2420;--muted:#6F665F;--faint:#857C75;--line:#E8E2DC;--line2:#D7CFC7;
  --accent:#F5A524;--accentfg:#2A2420;--sun:#CC3344;--sel:#2A2420;--selfg:#FFFFFF;--now:#E8590C;
  --shadow:0 1px 2px rgba(60,40,25,.06),0 10px 28px -14px rgba(60,40,25,.22);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181513;--raise:#221E1B;--card:#2C2724;--soft:#1D1a17;
  --fg:#F4EFEA;--muted:#B3A9A0;--faint:#968C84;--line:#302A26;--line2:#453D37;
  --accent:#F7B13A;--accentfg:#1E1A17;--sun:#FF7B7B;--sel:#F4EFEA;--selfg:#1E1A17;--now:#FF8A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181513;--raise:#221E1B;--card:#2C2724;--soft:#1D1a17;
  --fg:#F4EFEA;--muted:#B3A9A0;--faint:#968C84;--line:#302A26;--line2:#453D37;
  --accent:#F7B13A;--accentfg:#1E1A17;--sun:#FF7B7B;--sel:#F4EFEA;--selfg:#1E1A17;--now:#FF8A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
a{color:var(--fg);text-underline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
#app.wide{max-width:none}
.view{padding-bottom:calc(160px + env(safe-area-inset-bottom))}

/* ---------- sidhuvud (mobil) ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(20px + env(safe-area-inset-top)) 10px 10px 20px}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1;white-space:nowrap}
.top h1 span{font-weight:500;color:var(--muted)}
.hbtns{display:flex;align-items:center;gap:2px;flex:none}
.pill{height:38px;padding:0 15px;border-radius:19px;background:var(--raise);box-shadow:var(--shadow);font-size:14px;font-weight:700}
.icon{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.icon:hover{background:var(--card)}
.pill:hover{background:var(--soft)}
.dayhead h1{display:flex;align-items:center;gap:12px;letter-spacing:0}
.bignum{display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:18px;background:var(--raise);box-shadow:var(--shadow);font-size:28px;font-weight:800;letter-spacing:-.8px;color:var(--fg)!important}
.bignum.red{color:var(--sun)!important}
.dlab{display:flex;flex-direction:column;gap:3px;letter-spacing:0!important}
.dlab b{font-size:20px;font-weight:800;color:var(--fg);letter-spacing:-.3px}
.dlab>span{font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.wkb{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;background:var(--card);color:var(--fg)!important;font-size:12px;font-weight:700;letter-spacing:0!important}
.holi{margin:0;padding:0 20px 10px;font-size:14px;font-weight:700;color:var(--sun)}

/* ---------- månad (mobil) ---------- */
.grid{padding:2px 10px 0}
.whead,.wrow{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr))}
.whead{height:30px;align-items:center;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.whead .s{color:var(--sun)}
.whead .v{font-weight:500}
.wk{font-size:11px;font-weight:600;color:var(--faint);text-align:center;padding-top:14px}
.day{height:56px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px}
.day .n{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.day.out .n{color:var(--faint);font-weight:500}
.day.sun .n{color:var(--sun)}
.day.sel .n{background:var(--sel);color:var(--selfg)}
.day.today .n{background:var(--accent);color:var(--accentfg);font-weight:800}
.day.sel.today .n{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px}

/* ---------- listor ---------- */
.list{margin:12px 10px 0;background:var(--raise);border-radius:24px;box-shadow:var(--shadow);padding:4px 0 6px;overflow:hidden}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px 18px;gap:12px}
.lhead h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.lhead button,.back{font-size:14px;font-weight:700;color:var(--fg);min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);white-space:nowrap}
.lhead button:hover,.back:hover{background:var(--line)}
.ev{width:100%;display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 18px;text-align:left}
.ev+.ev{border-top:1px solid var(--line)}
.ev:hover{background:var(--soft)}
.ev .t{width:54px;flex:none;display:flex;flex-direction:column;gap:2px}
.ev.wide .t{width:90px}
.ev .t b{font-size:15px;font-weight:700}
.ev .t span{font-size:13px;color:var(--muted)}
.ev .d{width:10px;height:10px;border-radius:5px;flex:none}
.ev .x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev .x b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .x span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:0;padding:20px 18px;color:var(--muted);font-size:15px;line-height:1.5}
.sec{margin:0;font-size:16px;font-weight:800;color:var(--fg);padding:20px 20px 6px}

/* ---------- dag (mobil) ---------- */
.sticky{position:sticky;top:0;background:var(--bg);z-index:3}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:4px 10px 10px}
.strip button{height:62px;display:flex;flex-direction:column;align-items:center;gap:4px}
.strip .l{font-size:12px;font-weight:700;color:var(--muted)}
.strip .sun .l,.strip .sun .n{color:var(--sun)}
.strip .n{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.strip .sel .n{background:var(--sel);color:var(--selfg)}
.strip .today .n{background:var(--accent);color:var(--accentfg);font-weight:800}
.strip .sel.today .n{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.allday{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px 12px}
.allday>span{width:52px;font-size:12px;color:var(--muted);flex:none}
.chip{min-height:30px;padding:4px 12px;border-radius:15px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;max-width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.tl{position:relative;height:1172px;margin:0 10px;background:var(--raise);border-radius:24px;box-shadow:var(--shadow);cursor:copy}
.hr{position:absolute;left:0;right:0;display:flex;align-items:center;height:0}
.hr span{width:52px;flex:none;font-size:11px;font-weight:600;color:var(--faint);text-align:right;padding-right:10px}
.hr i{flex:1;height:1px;background:var(--line)}
.blk{position:absolute;border-radius:12px;padding:5px 9px;overflow:hidden;display:flex;flex-direction:column;gap:1px;text-align:left;font-size:12px;line-height:1.3;color:var(--fg);cursor:pointer}
.blk b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:color-mix(in srgb,var(--fg) 72%,transparent)}
.now{position:absolute;left:0;right:0;display:flex;align-items:center;height:0;z-index:2;pointer-events:none}
.now span{width:48px;text-align:right;padding-right:4px;font-size:11px;font-weight:800;color:var(--now)}
.now i{width:9px;height:9px;border-radius:5px;background:var(--now);flex:none}
.now em{flex:1;height:2px;background:var(--now)}
.nowc i{margin-left:-5px}

/* ---------- sök ---------- */
.sform{display:flex;gap:8px;padding:4px 14px 8px}
.sform input,.lockf input{flex:1;min-width:0;height:48px;border-radius:24px;border:1.5px solid transparent;background:var(--raise);box-shadow:var(--shadow);color:var(--fg);padding:0 18px;font:inherit;font-size:16px}
.sform input:focus,.lockf input:focus{border-color:var(--fg);outline:none}
.sform button{height:48px;padding:0 20px;border-radius:24px;background:var(--sel);color:var(--selfg);font-weight:700}

/* ---------- knapp + flikar (mobil) ---------- */
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;background:var(--accent);color:var(--accentfg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(200,120,10,.55);z-index:4}
.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));margin:0 auto;max-width:500px;background:var(--raise);box-shadow:var(--shadow);border-radius:26px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5px;z-index:5}
.tabs button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);border-radius:21px}
.tabs button[aria-current="page"]{color:var(--fg);background:var(--card);font-weight:800}

/* ---------- meddelanden ---------- */
.banner{margin:12px 12px 0;padding:12px 14px;border-radius:20px;background:var(--raise);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.45}
.banner b{display:block}
.banner button{flex:none;height:40px;padding:0 16px;border-radius:20px;background:var(--sel);color:var(--selfg);font-weight:700;font-size:14px}
.bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
.bar.on{opacity:1}
.bar::after{content:'';position:absolute;top:0;bottom:0;width:30%;background:var(--accent);animation:ld 1s infinite ease-in-out}
@keyframes ld{from{left:-30%}to{left:100%}}

/* ---------- blad / dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,20,12,.42);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));z-index:11;max-height:90dvh;overflow-y:auto;outline:none;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 16px}
.sheet h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.2;overflow-wrap:anywhere}
.shh{margin:22px 0 8px;font-size:15px;font-weight:800;color:var(--fg)}
.muted{color:var(--muted);margin:6px 0 8px;font-size:15px;line-height:1.5}
.meta{display:flex;flex-direction:column;gap:12px;margin:18px 0 20px;font-size:16px}
.meta div{display:flex;gap:12px;align-items:flex-start;overflow-wrap:anywhere}
.meta svg{flex:none;margin-top:1px;color:var(--muted)}
.desc{white-space:pre-line;color:var(--muted);font-size:15px;line-height:1.55;overflow-wrap:anywhere;margin:0 0 20px}
.btns{display:grid;gap:8px}
.btn{min-height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;text-decoration:none;padding:0 18px;text-align:center}
.btn.primary{background:var(--sel);color:var(--selfg)}
.btn.ghost{background:var(--raise);box-shadow:var(--shadow);color:var(--fg)}
.btn.ghost:hover{background:var(--soft)}
.btn.accent{background:var(--accent);color:var(--accentfg)}
.calrow{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line2);padding:3px;display:flex;flex:none;transition:.15s}
.switch i{width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.calrow[aria-checked="true"] .switch{background:var(--accent);justify-content:flex-end}
.seg{display:flex;padding:4px;border-radius:22px;background:var(--card);flex:none}
.seg button{height:34px;padding:0 16px;border-radius:17px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:0 1px 3px rgba(60,40,25,.15)}
.seg.full{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.full button{height:40px}

/* ---------- start-/låsskärm ---------- */
.center{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px 24px;max-width:440px;margin:0 auto}
.center h1{font-size:38px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1.05}
.center p{margin:0;font-size:16px;line-height:1.55;color:var(--muted)}
.center .err{color:var(--sun);font-size:15px;font-weight:700}
.code{font-family:ui-monospace,Consolas,monospace;background:var(--card);padding:10px 12px;border-radius:10px;font-size:13px;overflow-wrap:anywhere}
.lockf{display:grid;gap:10px}

/* ---------- formulär ---------- */
.form{display:flex;flex-direction:column;gap:12px}
.form h2{margin-bottom:4px}
.fgroup{background:var(--raise);box-shadow:var(--shadow);border-radius:20px;overflow:hidden;border:0;margin:0;padding:0;min-width:0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:6px 10px 6px 16px;border-top:1px solid var(--line)}
.fgroup>.frow:first-child{border-top:0}
.frow>label,.frow>span:first-child{font-size:15px;font-weight:600}
.fin{display:block;width:100%;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;padding:0 16px;height:52px;outline-offset:-2px}
.fin::placeholder{color:var(--faint)}
.fin.title{font-size:20px;font-weight:700;height:60px;letter-spacing:-.3px}
.fin.sep{border-top:1px solid var(--line)}
textarea.fin{height:auto;padding:12px 16px;resize:vertical;min-height:84px;line-height:1.5}
.fdt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fdt input,.fsel{height:40px;border-radius:12px;border:0;background:var(--card);color:var(--fg);font:inherit;font-size:15px;font-weight:600;padding:0 10px;min-width:0}
.form.ad .tm{display:none}
.tsw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.tsw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tsw:checked{background:var(--accent)}
.tsw:checked::after{left:23px}
.cpick{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.cpick label{position:relative;display:block}
.cpick input,.swatches input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.cpick span{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:20px;font-size:14px;font-weight:700;background:var(--card)}
.cpick span i{width:10px;height:10px;border-radius:5px;background:var(--c)}
.cpick input:checked+span{background:var(--c);color:var(--t,#fff)}
.cpick input:checked+span i{background:var(--t,#fff)}
.cpick input:focus-visible+span,.swatches input:focus-visible+span{outline:2px solid var(--fg);outline-offset:2px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:14px}
.swatches label{position:relative;width:40px;height:40px}
.swatches span{display:block;width:40px;height:40px;border-radius:20px;background:var(--c)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--raise),0 0 0 5px var(--fg)}
.ferr{color:var(--sun);font-size:15px;margin:0;font-weight:700}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sun);color:var(--sun)}
.calline{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.calline .calrow{border-bottom:0;flex:1;min-width:0}
.smallbtn{min-height:40px;padding:0 12px;font-size:14px;font-weight:700;color:var(--fg);border-radius:20px;background:var(--card)}
.smallbtn:hover{background:var(--line)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.bigmsg{font-size:17px;line-height:1.5;margin:12px 0 18px}

/* ===== DESKTOP: infopanel till vänster, kalender till höger ===== */
.desk{display:grid;grid-template-columns:clamp(340px,31vw,460px) minmax(0,1fr);height:100dvh}
.side{padding:20px 18px 24px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.sidetop{display:flex;align-items:center;gap:4px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;flex:1}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:var(--accentfg);font-style:normal;font-size:14px;font-weight:800}
.side .sform{padding:0}
.side .sform input{height:44px;font-size:15px}
.side .sform button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0}
.w{background:var(--raise);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px}
.w h3{margin:0 0 8px;font-size:15px;font-weight:800}
.hero{background:var(--sel);color:var(--selfg);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.hero .hd{display:flex;align-items:center;gap:14px}
.hero .hnum{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accentfg);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;letter-spacing:-.6px;flex:none}
.hero .hl{display:flex;flex-direction:column;gap:2px}
.hero .hl b{font-size:20px;font-weight:800;letter-spacing:-.3px}
.hero .hl span{font-size:14px;opacity:.75}
.hero .status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--selfg) 10%,transparent);font-size:14px;line-height:1.45;text-align:left;width:100%}
.hero .status:hover{background:color-mix(in srgb,var(--selfg) 16%,transparent)}
.hero .status i{width:9px;height:9px;border-radius:5px;flex:none;margin-top:5px}
.hero .status b{display:block;font-size:15px}
.agday+.agday{margin-top:10px}
.agd{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:4px 0 2px}
.agd.red{color:var(--sun)}
.agd em{font-style:normal;font-weight:600;font-size:12px}
.agi{display:flex;align-items:center;gap:10px;width:100%;min-height:30px;padding:2px 8px;margin:0 -8px;border-radius:9px;text-align:left;font-size:14px;box-sizing:content-box}
.agi:hover{background:var(--soft)}
.agi i{width:12px;height:12px;border-radius:6px;flex:none}
.agi .tm{width:42px;flex:none;color:var(--muted);font-size:13px;font-weight:600}

/* ---------- upprepning ---------- */
function stepDate(d, f, k) {
  const H = d.getHours(), M = d.getMinutes();
  if (f === 'd') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + k, H, M);
  if (f === 'w') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7 * k, H, M);
  if (f === '2w') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 14 * k, H, M);
  if (f === 'm') { const x = new Date(d.getFullYear(), d.getMonth() + k, d.getDate(), H, M); return x.getDate() === d.getDate() ? x : null; }
  const x = new Date(d.getFullYear() + k, d.getMonth(), d.getDate(), H, M); return x.getDate() === d.getDate() ? x : null;
}
function unitsBetween(a, b, f) {
  const days = Math.round((sod(b) - sod(a)) / 86400000);
  if (f === 'd') return days; if (f === 'w') return Math.floor(days / 7); if (f === '2w') return Math.floor(days / 14);
  const months = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  return f === 'm' ? months : Math.floor(months / 12);
}
function colorOf(e) { const c = calById(e.cal); return e.color || (c ? c.color : '#2450D8'); }

function occurrences(e, from, to) {
  if (!e.rep) return (e.start < to && e.end > from) ? [inst(e, e.start, e.end, null)] : [];
  const dur = e.end - e.start, out = [];
  const until = e.rep.until ? addDays(parseDate(e.rep.until), 1) : null;
  const lookFrom = new Date(from.getTime() - dur);
  let k = lookFrom > e.start ? Math.max(0, unitsBetween(e.start, lookFrom, e.rep.f) - 1) : 0;
  for (let guard = 0; guard < 500; guard++, k++) {
    const s = stepDate(e.start, e.rep.f, k);
    if (!s) continue;
    if (s >= to || (until && s >= until)) break;
    const en = new Date(s.getTime() + dur);
    if (en > from && !e.ex.has(dash(s))) out.push(inst(e, s, en, dash(s)));
  }
  return out;
}
function eventsOn(day) {
  const a = sod(day), b = addDays(a, 1), out = [];
  const vis = new Set(S.calendars.filter(c => c.on).map(c => c.id));
  for (const e of S.base) if (vis.has(e.cal)) out.push(...occurrences(e, a, b));
  out.sort((x, y) => (coversDay(y, day) - coversDay(x, day)) || (x.start - y.start) || x.title.localeCompare(y.title, 'sv'));
  return out;
}
function coversDay(e, day) { return e.allDay || (e.start <= sod(day) && e.end >= addDays(sod(day), 1)); }
function getInst(id, occ) {
  const b = S.byId.get(id); if (!b) return null;
  if (!occ) return inst(b, b.start, b.end, null);
  const d = parseDate(occ), s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), b.start.getHours(), b.start.getMinutes());
  return inst(b, s, new Date(s.getTime() + (b.end - b.start)), occ);
}
function repText(b) {
  if (!b.rep) return '';
  return REP[b.rep.f] + (b.rep.until ? ' till och med ' + parseDate(b.rep.until).getDate() + ' ' + MONTHS[parseDate(b.rep.until).getMonth()] + ' ' + parseDate(b.rep.until).getFullYear() : '');
}

const pushStod = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function defRemind() { const v = S.data && S.data.settings && S.data.settings.remind; return typeof v === 'number' ? v : 15; }
function remindOf(e) { return typeof e.remind === 'number' ? e.remind : defRemind(); }

  if (o.allDay) return m >= 1440 ? 'I morgon, heldag' : 'Idag, heldag';
  const where = o.location ? ', ' + o.location : '';
  if (m === 0) return 'Börjar nu, kl ' + hm(o.start) + where;
  if (m >= 1440) return 'I morgon kl ' + hm(o.start) + where;
  return 'Om ' + minText(m) + ', kl ' + hm(o.start) + where;
}
function pushList() {
  const now = Date.now(), end = addDays(today0(), 60).getTime(), out = [];
  if (!S.data) return out;
  const vis = new Set(S.calendars.filter(c => c.on).map(c => c.id));
  for (const b of S.base) {
    if (!vis.has(b.cal)) continue;
    const m = remindOf(b); if (m < 0) continue;
    for (const o of occurrences(b, new Date(now), new Date(end + 2 * 86400000))) {
      const base = o.allDay ? new Date(o.start.getFullYear(), o.start.getMonth(), o.start.getDate(), 8, 0) : o.start;
      const at = o.allDay ? base.getTime() - (m >= 1440 ? 86400000 : 0) : base.getTime() - m * 60000;
      if (at < now + 30000 || at > end) continue;
      out.push({ id: (o.id + '@' + (o.occ || '')).slice(0, 120), at, titel: o.title, text: pushText(o, m) });
    }
  }

}

  const data = await r.json().catch(() => ({}));

  catch (fel) {
    const gammal = await reg.pushManager.getSubscription();

}

   ===================================================================== */
let tokenClient = null;
function hasClientId() { return /\.apps\.googleusercontent\.com$/.test(CLIENT_ID.trim()); }
function gisLoaded() {
  if (!hasClientId()) return;
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID.trim(), scope: SCOPE, callback: onToken, error_callback: onTokenError });
}
function onToken(resp) {
  if (resp.error) { S.imp = { step: 'err', msg: 'Inloggningen hos Google misslyckades (' + resp.error + ').' }; render(); return; }
  S.gToken = resp.access_token; S.gTokenExp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
  store.set('kal_gconnected', true);
  if (S.sheet === 'import') impLoadCals();
}
function onTokenError(err) {
  S.imp = { step: 'err', msg: err && err.type === 'popup_closed' ? 'Inloggningsrutan stängdes innan du var klar.' : 'Inloggningsrutan kunde inte öppnas. Tillåt popup-fönster för sidan och försök igen.' };
  render();
}
async function gapi(path, params) {
  if (!S.gToken || Date.now() > S.gTokenExp - 30000) throw new Error('auth');
  const u = new URL('https://www.googleapis.com/calendar/v3' + path);
  Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { headers: { Authorization: 'Bearer ' + S.gToken } });
  if (r.status === 401) throw new Error('auth');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function gErr(e) {
  const m = String(e && e.message);
  if (m === 'auth') return 'Inloggningen hos Google har gått ut. Försök igen.';
  if (m === 'HTTP 403') return 'Google nekade åtkomst. Kontrollera att Google Calendar API är aktiverat i ditt Google Cloud-projekt.';
  if (m.indexOf('HTTP') === 0) return 'Google svarade med fel (' + m + ').';
  return 'Kunde inte nå Google. Kontrollera internetanslutningen.';
}
function impStart() {
  if (S.demo) { S.imp = { step: 'err', msg: 'Import fungerar inte i exempelläget.' }; render(); return; }
  if (S.gToken && Date.now() < S.gTokenExp - 60000) { impLoadCals(); return; }
  if (!tokenClient) { S.imp = { step: 'err', msg: 'Googles inloggning har inte laddats. Vänta några sekunder och försök igen. Hjälper det inte: stäng av Brave Shields för sidan (lejonikonen i adressfältet).' }; render(); return; }
  tokenClient.requestAccessToken({ prompt: store.get('kal_gconnected', false) ? '' : 'consent' });
}
async function impLoadCals() {
  S.imp = { step: 'busy', msg: 'Hämtar dina kalendrar från Google…' }; render();
  try {
    const r = await gapi('/users/me/calendarList', { maxResults: '250' });
    const cals = (r.items || []).map(c => ({ id: c.id, name: c.summaryOverride || c.summary || c.id, color: c.backgroundColor || '#2450D8', on: !!(c.selected || c.primary), primary: !!c.primary }))
      .sort((a, b) => (b.primary - a.primary) || a.name.localeCompare(b.name, 'sv'));
    S.imp = { step: 'pick', cals };
  } catch (e) { S.imp = { step: 'err', msg: gErr(e) }; }
  render();
}
function gToRaw(it, gcalId) {
  if (!it || it.status === 'cancelled' || !it.start) return null;
  const allDay = !!it.start.date;
  let start, end;
  if (allDay) { start = it.start.date; end = (it.end && it.end.date) || dash(addDays(parseDate(start), 1)); }
  else {
    const s = new Date(it.start.dateTime);
    let e = it.end && it.end.dateTime ? new Date(it.end.dateTime) : new Date(s.getTime() + 3600000);
    if (!(e > s)) e = new Date(s.getTime() + 60000);
    start = fmtLocal(s); end = fmtLocal(e);
  }
  const raw = { id: newId(), gid: gcalId + '|' + it.id, title: it.summary || '(Ingen titel)', start, end, allDay };
  if (it.location) raw.location = it.location;
  const d = cleanDesc(it.description); if (d) raw.desc = d;
  if (it.colorId && EVENT_COLORS[it.colorId]) raw.color = EVENT_COLORS[it.colorId];
  return raw;
}
async function impFetch() {
  const chosen = S.imp.cals.filter(c => c.on);
  if (!chosen.length) return;
  const cals = S.imp.cals;
  S.imp = { step: 'busy', msg: 'Hämtar händelser från Google…', cals };
  render();
  try {
    const t = today0(), from = addDays(t, -365), to = addDays(t, 730);
    const have = new Set(S.data.events.map(e => e.gid).filter(Boolean));
    const items = []; let skipped = 0;
    for (const c of chosen) {
      let pageToken = null;
      do {
        const p = { timeMin: from.toISOString(), timeMax: to.toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '250' };
        if (pageToken) p.pageToken = pageToken;
        const r = await gapi('/calendars/' + encodeURIComponent(c.id) + '/events', p);
        (r.items || []).forEach(it => {
          const raw = gToRaw(it, c.id); if (!raw) return;
          if (have.has(raw.gid)) { skipped++; return; }
          have.add(raw.gid); raw._g = c; items.push(raw);
        });
        pageToken = r.nextPageToken;
      } while (pageToken);
    }
    S.imp = { step: 'confirm', cals, chosen, items, skipped };
  } catch (e) { S.imp = { step: 'err', msg: gErr(e) }; }
  render();
}
async function impSave() {
  const { items, chosen } = S.imp;
  const n = items.length;
  S.imp = { step: 'busy', msg: 'Sparar ' + n + ' händelser i din datafil…' }; render();
  const ok = await mutate(d => {
    const map = {};
    chosen.forEach(gc => {
      let own = d.calendars.find(c => c.gcal === gc.id);
      if (!own) { own = { id: newId('c'), name: gc.name, color: gc.color, gcal: gc.id }; d.calendars.push(own); }
      map[gc.id] = own.id;
    });
    const have = new Set(d.events.map(e => e.gid).filter(Boolean));
    items.forEach(raw => {
      if (have.has(raw.gid)) return;
      const o = Object.assign({}, raw, { cal: map[raw._g.id] }); delete o._g;
      d.events.push(o);
    });
  }, 'import från Google Kalender (' + n + ' händelser)');
  S.imp = ok ? { step: 'done', n } : { step: 'err', msg: S.error || 'Det gick inte att spara.' };
  if (ok) {
    try { if (window.google && S.gToken) google.accounts.oauth2.revoke(S.gToken, () => {}); } catch (e) {}
    S.gToken = null;
  }
  render();
}

/* =====================================================================
   VISNING
   ===================================================================== */
function layout(evs, day) {
  const d0 = sod(day).getTime();
  const items = evs.map(e => ({ e, s: Math.max(0, (e.start - d0) / 3600000), en: Math.min(24, (e.end - d0) / 3600000) }))
    .sort((a, b) => a.s - b.s || b.en - a.en);
  const out = []; let cluster = [], cEnd = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => {
      let c = cols.findIndex(endT => endT <= it.s);
      if (c < 0) { c = cols.length; cols.push(0); }
      cols[c] = Math.max(it.en, it.s + 0.5); it.col = c;
    });
    cluster.forEach(it => { it.ncol = cols.length; });
    out.push(...cluster); cluster = [];
  };
  items.forEach(it => {
    if (cluster.length && it.s >= cEnd) { flush(); cEnd = -1; }
    cluster.push(it); cEnd = Math.max(cEnd, it.en, it.s + 0.5);
  });
  if (cluster.length) flush();
  return out;
}
const oAttr = e => `data-id="${esc(e.id)}"${e.occ ? ` data-o="${e.occ}"` : ''}`;
function blockHtml(it, L, W) {
  const e = it.e, top = it.s * HOUR + PAD + 1, h = Math.max(22, (it.en - it.s) * HOUR - 2), tall = h >= 40;
  const left = `calc(${L} + (${W}) * ${it.col} / ${it.ncol})`, width = `calc((${W}) / ${it.ncol} - 3px)`;
  const info = tall ? hm(e.start) + '–' + hm(e.end) : hm(e.start);
  const locS = h >= 62 && e.location ? `<span>${esc(e.location)}</span>` : '';
  return `<button class="blk" data-act="open" ${oAttr(e)} style="--c:${esc(e.color)};--t:${onColor(e.color)};top:${top}px;height:${h}px;left:${left};width:${width};background:${tint(e.color)};box-shadow:inset 0 0 0 1px color-mix(in srgb, ${esc(e.color)} 45%, transparent);${tall ? '' : 'flex-direction:row;align-items:center;gap:6px;padding:0 8px;'}"><b>${esc(e.title)}</b><span>${esc(info)}</span>${locS}</button>`;
}

function deskMonth() {
  const m = S.month, t = today0(), start = mondayOf(m);
  const last = new Date(m.getFullYear(), m.getMonth() + 1, 0);
  const weeks = Math.ceil((Math.round((last - start) / 86400000) + 1) / 7);
  const max = weeks === 6 ? 3 : 4;

});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || S.mode !== 'app' || S.demo || S.dirty || S.sheet || S.saving) return;
  if (Date.now() - S.lastFetch > 30000) sync();
});
deskMQ.addEventListener('change', e => { S.desk = e.matches; if (S.desk) window.scrollTo(0, 0); S.scrollDay = true; render(); });
darkMQ.addEventListener('change', () => { applyTheme(); render(); });
setInterval(() => { if (S.mode === 'app' && (S.view === 'day' || S.view === 'week') && !S.sheet) render(); }, 60000);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installPrompt = e; if (S.sheet === 'settings') render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- start ---------- */
function boot() {
  S.theme = store.get('kal_theme', 'auto'); S.push = store.get('kal_push', false); applyTheme();
  if (new URLSearchParams(location.search).has('demo')) { S.demo = true; S.data = demoData(); S.mode = 'app'; rebuild(); render(); return; }
  const tok = ghTok();
  if (!tok) { S.mode = 'lock'; render(); return; }
  boot2();
  checkGh(tok).then(ok => { if (!ok) lockPage('Din GitHub-token fungerar inte längre. Klistra in en ny.'); }).catch(() => {});
}
function boot2() {
  const c = store.get('kal_cache', null);
  if (c && c.data) { S.data = normalize(c.data); S.sha = c.sha; S.mode = 'app'; rebuild(); render(); }
  else { S.mode = 'loading'; render(); }
  sync();
}
boot();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
