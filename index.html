<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender</title>
<meta name="theme-color" content="#ffffff" id="tc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--fg:#16181D;--muted:#5F6570;--faint:#6B7079;--line:#ECEEF1;--line2:#D9DCE1;--card:#F3F4F6;--accent:#2450D8;--accentfg:#fff;--sun:#C0362C;--sel:#16181D;--selfg:#fff;--now:#C0362C;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--fg:#F2F0EB;--muted:#A3A7AE;--faint:#8E939B;--line:#23262C;--line2:#3A3E46;--card:#1C1F24;--accent:#8FA8FF;--accentfg:#121417;--sun:#FF8A7E;--sel:#F2F0EB;--selfg:#121417;--now:#FF6B5E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121417;--fg:#F2F0EB;--muted:#A3A7AE;--faint:#8E939B;--line:#23262C;--line2:#3A3E46;--card:#1C1F24;--accent:#8FA8FF;--accentfg:#121417;--sun:#FF8A7E;--sel:#F2F0EB;--selfg:#121417;--now:#FF6B5E;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
#app.wide{max-width:none}
.view{padding-bottom:calc(160px + env(safe-area-inset-bottom))}

/* sidhuvud (mobil) */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(18px + env(safe-area-inset-top)) 12px 8px 20px}
.top h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;line-height:1.15}
.top h1 span,.dtop h1 span{font-weight:500;color:var(--muted)}
.top h1 .sub{display:block;font-size:15px;letter-spacing:0;margin-top:2px}
.hbtns{display:flex;align-items:center;gap:2px;flex:none}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);font-size:14px;font-weight:600}
.icon{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.icon:hover,.pill:hover{background:var(--card)}

/* månad (mobil) */
.grid{padding:0 12px}
.whead,.wrow{display:grid;grid-template-columns:26px repeat(7,minmax(0,1fr))}
.whead{height:28px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.whead .s{color:var(--sun)}
.whead .v{font-size:11px;font-weight:500}
.wk{font-size:11px;color:var(--faint);text-align:center;padding-top:13px}
.day{height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:3px}
.day .n{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500}
.day.out .n{color:var(--faint);font-weight:400}
.day.sun .n{color:var(--sun)}
.day.today .n{color:var(--accent);font-weight:700}
.day.sel .n{background:var(--sel);color:var(--selfg);font-weight:700}
.day.sel.today .n{background:var(--accent);color:var(--accentfg)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:3px}

/* listor */
.list{margin-top:6px;border-top:1px solid var(--line)}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 2px 20px;gap:12px}
.lhead h2{margin:0;font-size:18px;font-weight:700}
.lhead button,.back{font-size:14px;font-weight:600;color:var(--accent);min-height:44px;padding:0 8px;border-radius:10px;white-space:nowrap}
.ev{width:100%;display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 20px;text-align:left;border-bottom:1px solid var(--line)}
.ev:hover{background:var(--card)}
.ev .t{width:54px;flex:none;display:flex;flex-direction:column;gap:1px}
.ev.wide .t{width:86px}
.ev .t b{font-size:15px;font-weight:600}
.ev .t span{font-size:13px;color:var(--muted)}
.ev .d{width:10px;height:10px;border-radius:5px;flex:none}
.ev .x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev .x b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .x span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:0;padding:22px 20px;color:var(--muted);font-size:16px;line-height:1.45}
.sec{margin:0;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);padding:18px 20px 6px}

/* dag (mobil) */
.sticky{position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:4px 12px 8px}
.strip button{height:64px;display:flex;flex-direction:column;align-items:center;gap:4px}
.strip .l{font-size:12px;font-weight:600;color:var(--muted)}
.strip .sun .l,.strip .sun .n{color:var(--sun)}
.strip .n{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500}
.strip .today .n{color:var(--accent);font-weight:700}
.strip .sel .n{background:var(--sel);color:var(--selfg);font-weight:700}
.strip .sel.today .n{background:var(--accent);color:var(--accentfg)}
.allday{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 16px 10px}
.allday>span{width:52px;font-size:12px;color:var(--muted);flex:none}
.chip{min-height:28px;padding:4px 10px;border-radius:14px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;max-width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{position:relative;height:1172px;margin-top:8px}
.hr{position:absolute;left:0;right:0;display:flex;align-items:center;height:0}
.hr span{width:52px;flex:none;font-size:12px;color:var(--muted);text-align:right;padding-right:8px}
.hr i{flex:1;height:1px;background:var(--line)}
.blk{position:absolute;border-radius:8px;padding:4px 8px;overflow:hidden;display:flex;flex-direction:column;gap:1px;text-align:left;font-size:12px;line-height:1.3;color:var(--fg)}
.blk b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;opacity:.85}
.now{position:absolute;left:0;right:0;display:flex;align-items:center;height:0;z-index:2;pointer-events:none}
.now span{width:48px;text-align:right;padding-right:4px;font-size:11px;font-weight:700;color:var(--now)}
.now i{width:8px;height:8px;border-radius:4px;background:var(--now);flex:none}
.now em{flex:1;height:2px;background:var(--now)}
.nowc i{margin-left:-4px}

/* sök */
.sform{display:flex;gap:8px;padding:4px 16px 8px}
.sform input,.lockf input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--fg);padding:0 14px;font:inherit;font-size:16px}
.sform button{height:48px;padding:0 18px;border-radius:14px;background:var(--sel);color:var(--selfg);font-weight:700}

/* knapp + flikar (mobil) */
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;background:var(--sel);color:var(--selfg);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:4}
.tabs{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--fg);font-weight:700}

/* meddelanden */
.banner{margin:10px 16px 0;padding:12px 14px;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.4}
.banner b{display:block}
.banner button{flex:none;height:40px;padding:0 14px;border-radius:12px;background:var(--sel);color:var(--selfg);font-weight:700;font-size:14px}
.bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
.bar.on{opacity:1}
.bar::after{content:'';position:absolute;top:0;bottom:0;width:30%;background:var(--accent);animation:ld 1s infinite ease-in-out}
@keyframes ld{from{left:-30%}to{left:100%}}

/* blad / dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));z-index:11;max-height:88dvh;overflow-y:auto;outline:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sheet h2{margin:0;font-size:22px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.shh{margin:20px 0 8px;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.muted{color:var(--muted);margin:6px 0 8px;font-size:15px;line-height:1.45}
.meta{display:flex;flex-direction:column;gap:12px;margin:16px 0 18px;font-size:16px}
.meta div{display:flex;gap:12px;align-items:flex-start;overflow-wrap:anywhere}
.meta svg{flex:none;margin-top:1px;color:var(--muted)}
.desc{white-space:pre-line;color:var(--muted);font-size:15px;line-height:1.45;overflow-wrap:anywhere;margin:0 0 18px}
.btns{display:grid;gap:8px}
.btn{min-height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-decoration:none;padding:0 16px;text-align:center}
.btn.primary{background:var(--sel);color:var(--selfg)}
.btn.ghost{border:1px solid var(--line2);color:var(--fg)}
.calrow{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line2);padding:3px;display:flex;flex:none;transition:.15s}
.switch i{width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.calrow[aria-checked="true"] .switch{background:var(--accent);justify-content:flex-end}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--card);flex:none}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.full{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.full button{height:40px}

/* start-/låsskärm */
.center{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px 24px;max-width:440px;margin:0 auto}
.center h1{font-size:34px;margin:0;letter-spacing:-.5px}
.center p{margin:0;font-size:17px;line-height:1.5;color:var(--muted)}
.center .err{color:var(--sun);font-size:15px}
.code{font-family:ui-monospace,Consolas,monospace;background:var(--card);padding:10px 12px;border-radius:10px;font-size:13px;overflow-wrap:anywhere}
.lockf{display:grid;gap:10px}

/* ===== DESKTOP ===== */
.desk{display:grid;grid-template-columns:272px minmax(0,1fr);height:100dvh}
.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.brand{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;padding:0 6px}
.mini .mh{display:flex;align-items:center;justify-content:space-between;padding:0 0 6px 6px;font-weight:700;font-size:15px}
.mini .mh span{display:flex}
.mini .mh button{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.mini .mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.mini .mg>span{font-size:11px;color:var(--muted);font-weight:600;height:24px;line-height:24px}
.mini .mg button{height:32px;border-radius:16px;font-size:13px;font-weight:500}
.mini .mg button:hover,.mini .mh button:hover{background:var(--card)}
.mini .mg .out{color:var(--faint)}
.mini .mg .has{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--line2)}
.mini .mg .inwk{background:var(--card)}
.mini .mg .today{color:var(--accent);font-weight:700}
.mini .mg .sel{background:var(--sel);color:var(--selfg);font-weight:700}
.mini .mg .sel.today{background:var(--accent);color:var(--accentfg)}
.side h3{margin:0 0 6px 6px;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.ccheck{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 8px;border-radius:10px;text-align:left;font-size:15px}
.ccheck:hover{background:var(--card)}
.ccheck .box{width:18px;height:18px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--c);color:#fff}
.ccheck .box svg{opacity:0}
.ccheck[aria-checked="true"] .box{background:var(--c)}
.ccheck[aria-checked="true"] .box svg{opacity:1}
.ccheck .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmain{display:flex;flex-direction:column;min-width:0;height:100dvh}
.dtop{display:flex;align-items:center;gap:6px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dtop h1{margin:0 8px;font-size:22px;font-weight:700;white-space:nowrap}
.dtop .sp{flex:1}
.dtop .sform{padding:0;width:240px}
.dtop .sform input{height:40px;border-radius:12px;font-size:15px}
.dtop .sform button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0}
.dmain .banner{margin:10px 20px 0}
.dmonth{flex:1;display:flex;flex-direction:column;min-height:0}
.dmh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.dmh span{padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.dmh .s{color:var(--sun)}
.dmg{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0}
.dcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;cursor:pointer}
.dcell:nth-child(7n){border-right:0}
.dcell:hover{background:color-mix(in srgb,var(--card) 55%,var(--bg))}
.dcell.out{background:color-mix(in srgb,var(--card) 45%,var(--bg))}
.dcell.sel{box-shadow:inset 0 0 0 2px var(--line2)}
.dcell .dn{align-self:flex-start;min-width:28px;height:28px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 7px;flex:none}
.dcell .dn:hover{background:var(--line)}
.dcell.sun .dn{color:var(--sun)}
.dcell.out .dn{color:var(--faint)}
.dcell.today .dn{background:var(--accent);color:var(--accentfg)}
.dev{display:flex;align-items:center;gap:6px;width:100%;min-height:22px;padding:0 6px;border-radius:6px;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;flex:none}
.dev:hover{background:var(--line)}
.dev i{width:7px;height:7px;border-radius:4px;flex:none}
.dev .tm{color:var(--muted);flex:none}
.dev b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.more{font-size:12px;color:var(--muted);font-weight:600;padding:0 6px;text-align:left;min-height:20px;flex:none;align-self:flex-start;border-radius:6px}
.more:hover{background:var(--line);color:var(--fg)}
.dweek{flex:1;display:flex;flex-direction:column;min-height:0}
.dwh,.dwa,.wgrid{display:grid;grid-template-columns:60px repeat(var(--n),minmax(0,1fr))}
.dwh{border-bottom:1px solid var(--line)}
.dwh button{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
.dwh button:hover{background:var(--card)}
.dwh .l{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.dwh .n{min-width:38px;height:38px;border-radius:19px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
.dwh .sun .l,.dwh .sun .n{color:var(--sun)}
.dwh .today .n{background:var(--accent);color:var(--accentfg)}
.dwa{border-bottom:1px solid var(--line);padding:4px 0}
.dwa .lab{font-size:11px;color:var(--muted);text-align:right;padding:6px 8px 0 0}
.dwa>div{display:flex;flex-direction:column;gap:2px;padding:0 2px;min-width:0}
.dwa .chip{border-radius:6px;min-height:24px;font-size:12px;display:block;line-height:16px}
.wscroll{flex:1;overflow-y:auto;min-height:0}
.wgrid{position:relative;height:1172px}
.wgrid .hr span{width:56px}
.wcol{position:relative;border-left:1px solid var(--line);height:100%}
.wcol.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}

@media (max-width:1279px){
  .desk{grid-template-columns:232px minmax(0,1fr)}
  .dtop .sform{width:170px}
  .dev .tm{display:none}
}
@media (min-width:1024px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:460px;max-width:calc(100vw - 32px);border-radius:20px;padding:24px;max-height:85vh}
  .grab{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   KLISTRA IN DITT KLIENT-ID HÄR (mellan apostroferna).
   Det ser ut ungefär så här: 123456789-abc123.apps.googleusercontent.com
   ===================================================================== */
const CLIENT_ID = '565697046213-fgdvirngrtei527ct4ml66r06rdok3vh.apps.googleusercontent.com';

/* GitHub-kontot som får låsa upp sidan */
const GITHUB_USER = 'tomas-m-andersson';

/* ---------- Inget nedanför behöver ändras ---------- */
const SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const HOUR = 48, PAD = 10;
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const MONTHS_SHORT = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const DAYS = ['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
const DAYS_SHORT = ['sön','mån','tis','ons','tor','fre','lör'];
const EVENT_COLORS = {1:'#7986CB',2:'#33B679',3:'#8E24AA',4:'#E67C73',5:'#F6BF26',6:'#F4511E',7:'#039BE5',8:'#616161',9:'#3F51B5',10:'#0B8043',11:'#D50000'};

const today0 = () => sod(new Date());
const deskMQ = window.matchMedia('(min-width: 1024px)');
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
const S = {
  mode: 'start', view: 'month', backView: 'month', demo: false, desk: deskMQ.matches,
  sel: today0(), month: firstOfMonth(new Date()),
  token: null, tokenExp: 0, needAuth: false,
  calendars: [], events: new Map(), loaded: new Set(),
  loading: 0, error: '', lastFetch: 0, addedAt: 0,
  sheet: null, scrollDay: false, theme: 'auto',
  lockErr: '', lockBusy: false, installPrompt: null,
  search: { q: '', results: null, busy: false }
};

/* ---------- hjälpfunktioner ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function sod(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function mondayOf(d) { return addDays(sod(d), -((d.getDay() + 6) % 7)); }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const dash = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const mkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function parseDate(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function calName(id) { const c = S.calendars.find(x => x.id === id); return c ? c.name : ''; }
function dayLabel(d) { return cap(DAYS[d.getDay()]) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function tint(c, p) { return `color-mix(in srgb, ${esc(c)} ${p || 24}%, var(--bg))`; }
/* vilken vy som faktiskt visas (mobilen har ingen veckovy) */
function curView() { return !S.desk && S.view === 'week' ? 'day' : S.view; }

/* ---------- GitHub-lås ---------- */
async function checkGh(tok) {
  const r = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' } });
  if (r.status === 401 || r.status === 403) return false;
  if (!r.ok) throw new Error('net');
  const u = await r.json();
  return String(u.login || '').toLowerCase() === GITHUB_USER.toLowerCase();
}
async function unlock(tok) {
  S.lockBusy = true; S.lockErr = ''; render();
  try {
    if (await checkGh(tok)) { store.set('kal_gh', tok); S.lockBusy = false; boot2(); return; }
    S.lockErr = 'Den token fungerar inte, eller hör inte till ditt GitHub-konto. Kontrollera att du kopierade hela.';
  } catch (e) { S.lockErr = 'Kunde inte nå GitHub. Kontrollera internetanslutningen och försök igen.'; }
  S.lockBusy = false; render();
}
function lockPage() {
  store.del('kal_gh'); S.sheet = null; S.lockErr = ''; S.mode = 'lock'; render();
}

/* ---------- Google-inloggning ---------- */
let tokenClient = null;
function hasClientId() { return /\.apps\.googleusercontent\.com$/.test(CLIENT_ID.trim()); }
function gisLoaded() {
  if (!hasClientId()) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID.trim(), scope: SCOPE, callback: onToken, error_callback: onTokenError
  });
}
function signIn() {
  if (!tokenClient) {
    S.error = 'Googles inloggning har inte laddats. Vänta några sekunder och försök igen. Om det inte hjälper: stäng av Brave Shields för den här sidan (lejonikonen i adressfältet).';
    render(); return;
  }
  S.error = '';
  tokenClient.requestAccessToken({ prompt: store.get('kal_connected', false) ? '' : 'consent' });
}
function onToken(resp) {
  if (resp.error) { S.error = 'Inloggningen misslyckades (' + resp.error + ').'; render(); return; }
  S.token = resp.access_token;
  S.tokenExp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
  store.set('kal_token', { v: S.token, exp: S.tokenExp });
  store.set('kal_connected', true);
  S.error = '';
  startApp();
}
function onTokenError(err) {
  S.error = err && err.type === 'popup_closed'
    ? 'Inloggningsrutan stängdes innan du var klar. Försök igen.'
    : 'Inloggningsrutan kunde inte öppnas. Tillåt popup-fönster för sidan och försök igen.';
  render();
}
function logout() {
  try { if (S.token && window.google) google.accounts.oauth2.revoke(S.token, () => {}); } catch (e) {}
  store.del('kal_token'); store.del('kal_connected');
  S.token = null; S.calendars = []; S.events.clear(); S.loaded.clear();
  S.sheet = null; S.needAuth = false; S.mode = 'login'; render();
}

/* ---------- hämta data från Google ---------- */
async function api(path, params) {
  if (!S.token || Date.now() > S.tokenExp - 30000) throw new Error('auth');
  const u = new URL('https://www.googleapis.com/calendar/v3' + path);
  Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { headers: { Authorization: 'Bearer ' + S.token } });
  if (r.status === 401) { store.del('kal_token'); throw new Error('auth'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function loadCalendars() {
  const r = await api('/users/me/calendarList', { maxResults: '250' });
  const vis = store.get('kal_vis', {});
  S.calendars = (r.items || []).map(c => ({
    id: c.id,
    name: c.summaryOverride || c.summary || c.id,
    color: c.backgroundColor || '#2450D8',
    primary: !!c.primary,
    on: c.id in vis ? !!vis[c.id] : !!(c.selected || c.primary)
  })).sort((a, b) => (b.primary - a.primary) || a.name.localeCompare(b.name, 'sv'));
}
function addEvent(it, c) {
  if (!it || it.status === 'cancelled' || !it.start) return null;
  const allDay = !!it.start.date;
  const start = allDay ? parseDate(it.start.date) : new Date(it.start.dateTime);
  let end = it.end ? (allDay ? parseDate(it.end.date) : new Date(it.end.dateTime)) : null;
  if (!end || !(end > start)) end = allDay ? addDays(start, 1) : new Date(start.getTime() + 60000);
  const desc = (it.description || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').slice(0, 2000);
  const e = {
    id: c.id + '|' + it.id, cal: c.id, title: it.summary || '(Ingen titel)',
    location: it.location || '', desc, allDay, start, end,
    color: (it.colorId && EVENT_COLORS[it.colorId]) || c.color, link: it.htmlLink || ''
  };
  S.events.set(e.id, e);
  return e;
}
async function loadCal(c, from, to) {
  let pageToken = null;
  do {
    const p = { timeMin: from.toISOString(), timeMax: to.toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '250' };
    if (pageToken) p.pageToken = pageToken;
    const r = await api('/calendars/' + encodeURIComponent(c.id) + '/events', p);
    (r.items || []).forEach(it => addEvent(it, c));
    pageToken = r.nextPageToken;
  } while (pageToken);
}
async function ensureMonth(d) {
  const k = mkey(d);
  if (S.loaded.has(k)) return;
  S.loaded.add(k);
  const from = addDays(firstOfMonth(d), -7);
  const to = addDays(new Date(d.getFullYear(), d.getMonth() + 1, 1), 14);
  if (S.demo) { addDemo(from, to); return; }
  S.loading++; render();
  try {
    await Promise.all(S.calendars.map(c => loadCal(c, from, to)));
    S.lastFetch = Date.now();
  } catch (err) { S.loaded.delete(k); handleErr(err); }
  finally { S.loading--; }
}
async function loadVisible() {
  if (S.needAuth) return;
  const ws = mondayOf(S.sel);
  const keys = new Set([mkey(S.month), mkey(S.sel), mkey(ws), mkey(addDays(ws, 6))]);
  for (const k of keys) {
    const p = k.split('-').map(Number);
    await ensureMonth(new Date(p[0], p[1] - 1, 1));
    if (S.needAuth) break;
  }
  render();
}
function refresh() { S.events.clear(); S.loaded.clear(); S.error = ''; return loadVisible(); }
function handleErr(err) {
  const m = String((err && err.message) || err);
  if (m === 'auth') { S.needAuth = true; S.token = null; }
  else if (m === 'HTTP 403') S.error = 'Google nekade åtkomst (403). Kontrollera att Google Calendar API är aktiverat i ditt Google Cloud-projekt.';
  else if (m.indexOf('HTTP') === 0) S.error = 'Kunde inte hämta kalendern (' + m + '). Försök igen om en stund.';
  else S.error = 'Kunde inte nå Google. Kontrollera internetanslutningen.';
  render();
}
async function startApp() {
  S.mode = 'app'; S.needAuth = false; S.events.clear(); S.loaded.clear();
  render();
  try {
    if (S.demo) setupDemo();
    else if (!S.calendars.length) {
      S.loading++; render();
      try { await loadCalendars(); } finally { S.loading--; }
    }
    await loadVisible();
  } catch (err) { handleErr(err); }
}

/* ---------- exempeldata ---------- */
function setupDemo() {
  S.calendars = [
    { id: 'f', name: 'Familj', color: '#1F7A66', on: true, primary: true },
    { id: 'j', name: 'Jobb', color: '#2F5BD3', on: true },
    { id: 'l', name: 'Fritid', color: '#C2570C', on: true }
  ];
}
function addDemo(from, to) {
  const t = today0();
  for (let d = sod(from); d < to; d = addDays(d, 1)) {
    const wd = d.getDay(), n = d.getDate();
    const add = (cal, title, h1, h2, loc) => {
      const s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(h1), Math.round((h1 % 1) * 60));
      const e = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(h2), Math.round((h2 % 1) * 60));
      const c = S.calendars.find(x => x.id === cal);
      const id = 'demo|' + ymd(d) + '|' + title;
      S.events.set(id, { id, cal, title, location: loc || '', desc: '', allDay: false, start: s, end: e, color: c.color, link: '' });
    };
    const allDay = (cal, title, days) => {
      const c = S.calendars.find(x => x.id === cal);
      const id = 'demo|' + ymd(d) + '|' + title;
      S.events.set(id, { id, cal, title, location: '', desc: '', allDay: true, start: d, end: addDays(d, days || 1), color: c.color, link: '' });
    };
    if (wd === 2 || wd === 4) add('f', 'Fotbollsträning', 17.5, 19, 'Idrottsplatsen');
    if (wd === 1 && n <= 7) add('j', 'Månadsmöte', 9, 10, 'Teams');
    if (wd === 3) add('j', 'Lunch med Anna', 12, 13, 'Café Linnea');
    if (wd === 5) add('l', 'Fredagsmys', 19, 21);
    if (n === 12) add('f', 'Tandläkare', 8.5, 9.25, 'Folktandvården');
    if (n === 18) add('l', 'Middag med vänner', 18, 21, 'Hemma hos Sara');
    if (n === 25) allDay('f', 'Morfar fyller år');
    if (wd === 6 && n > 21) add('l', 'Kalas', 14, 16, 'Lekland');
    if (sameDay(d, t)) { add('l', 'Frisör', 10, 10.75, 'Salong Klipp'); add('j', 'Ringa skolan', 12.5, 13); }
    if (sameDay(d, addDays(t, 1))) add('f', 'Föräldramöte', 19, 20.5, 'Skolan, aulan');
  }
}
function exitDemo() {
  S.demo = false; S.calendars = []; S.events.clear(); S.loaded.clear(); S.sheet = null; S.error = '';
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  boot();
}

/* ---------- vilka händelser finns en viss dag ---------- */
function eventsOn(day) {
  const a = sod(day), b = addDays(a, 1);
  const vis = new Set(S.calendars.filter(c => c.on).map(c => c.id));
  const out = [];
  S.events.forEach(e => { if (vis.has(e.cal) && e.start < b && e.end > a) out.push(e); });
  out.sort((x, y) => (coversDay(y, day) - coversDay(x, day)) || (x.start - y.start) || x.title.localeCompare(y.title, 'sv'));
  return out;
}
function coversDay(e, day) { return e.allDay || (e.start <= sod(day) && e.end >= addDays(sod(day), 1)); }
function layout(evs, day) {
  const d0 = sod(day).getTime();
  const items = evs.map(e => ({ e, s: Math.max(0, (e.start - d0) / 3600000), en: Math.min(24, (e.end - d0) / 3600000) }))
    .sort((a, b) => a.s - b.s || b.en - a.en);
  const out = []; let cluster = [], cEnd = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => {
      let c = cols.findIndex(endT => endT <= it.s);
      if (c < 0) { c = cols.length; cols.push(0); }
      cols[c] = Math.max(it.en, it.s + 0.5); it.col = c;
    });
    cluster.forEach(it => { it.ncol = cols.length; });
    out.push(...cluster); cluster = [];
  };
  items.forEach(it => {
    if (cluster.length && it.s >= cEnd) { flush(); cEnd = -1; }
    cluster.push(it); cEnd = Math.max(cEnd, it.en, it.s + 0.5);
  });
  if (cluster.length) flush();
  return out;
}
/* ett händelseblock i tidslinjen; L = startposition, W = tillgänglig bredd */
function blockHtml(it, L, W) {
  const e = it.e, top = it.s * HOUR + PAD + 1, h = Math.max(22, (it.en - it.s) * HOUR - 2), tall = h >= 40;
  const left = `calc(${L} + (${W}) * ${it.col} / ${it.ncol})`, width = `calc((${W}) / ${it.ncol} - 3px)`;
  const info = tall ? hm(e.start) + '–' + hm(e.end) + (e.location ? ' · ' + e.location : '') : hm(e.start);
  return `<button class="blk" data-act="open" data-id="${esc(e.id)}" style="top:${top}px;height:${h}px;left:${left};width:${width};background:${tint(e.color)};box-shadow:inset 0 0 0 1px color-mix(in srgb, ${esc(e.color)} 45%, transparent);${tall ? '' : 'flex-direction:row;align-items:center;gap:6px;padding:0 8px;'}"><b>${esc(e.title)}</b><span>${esc(info)}</span></button>`;
}
function hourLines() {
  let h = '';
  for (let i = 0; i < 24; i++) h += `<div class="hr" style="top:${i * HOUR + PAD}px"><span>${pad(i)}:00</span><i></i></div>`;
  return h;
}
function nowTop() { const n = new Date(); return (n.getHours() + n.getMinutes() / 60) * HOUR + PAD; }

  return [e.start < a ? 'Forts.' : hm(e.start), e.end > b ? '' : hm(e.end)];

function srow(e) {

  const date = DAYS_SHORT[e.start.getDay()] + ' ' + e.start.getDate() + ' ' + MONTHS_SHORT[e.start.getMonth()] + y;

function searchBody() {
  const r = S.search;
  if (r.busy) return '<p class="empty">Söker…</p>';
  if (!r.results) return '<p class="empty">Sök på titel eller plats. Jag letar ett år bakåt och ett år framåt.</p>';
  if (!r.results.length) return `<p class="empty">Hittade inget som matchar ”${esc(r.q)}”.</p>`;
  const n = new Date(), up = r.results.filter(e => e.end >= n), past = r.results.filter(e => e.end < n).reverse();
  let b = '';
  if (up.length) b += '<h2 class="sec">KOMMANDE</h2>' + up.map(srow).join('');
  if (past.length) b += '<h2 class="sec">TIDIGARE</h2>' + past.slice(0, 30).map(srow).join('');
  return b;
}
function searchForm(cls) {
  return `<form class="sform ${cls || ''}" data-form="search" role="search"><label for="q" class="sr">Sök händelse</label><input id="q" name="q" type="search" value="${esc(S.search.q)}" placeholder="Sök händelse" enterkeyhint="search" autocomplete="off"><button type="submit">Sök</button></form>`;
}
async function doSearch(q) {
  if (S.view !== 'search') S.backView = S.view;
  S.view = 'search';
  S.search = { q, results: null, busy: true }; render();
  let res = [];
  try {
    const ql = q.toLowerCase();
    if (S.demo) {
      res = [...S.events.values()].filter(e => (e.title + ' ' + e.location).toLowerCase().indexOf(ql) >= 0);
    } else {
      const t = today0(), from = addDays(t, -365), to = addDays(t, 365), found = new Map();
      await Promise.all(S.calendars.filter(c => c.on).map(async c => {
        const r = await api('/calendars/' + encodeURIComponent(c.id) + '/events', { q, timeMin: from.toISOString(), timeMax: to.toISOString(), singleEvents: 'true', orderBy: 'startTime', maxResults: '100' });
        (r.items || []).forEach(it => { const e = addEvent(it, c); if (e) found.set(e.id, e); });
      }));
      res = [...found.values()];
    }
  } catch (err) { handleErr(err); }
  S.search = { q, results: res.sort((a, b) => a.start - b.start), busy: false }; render();
}
function whenText(e) {
  if (e.allDay) {
    const last = addDays(e.end, -1);
    return sameDay(e.start, last) ? dayLabel(e.start) + ' · heldag' : dayLabel(e.start) + ' – ' + dayLabel(last).toLowerCase();
  }
  const endsSameDay = sameDay(e.start, e.end) || (e.end.getTime() === sod(e.end).getTime() && sameDay(e.start, addDays(e.end, -1)));

function deskTime(days) {

/* ---------- rita upp ---------- */
function render() {
  const app = document.getElementById('app');
  document.body.style.overflow = S.sheet ? 'hidden' : '';
  app.classList.toggle('wide', S.mode === 'app' && S.desk);
  if (S.mode === 'lock') { app.innerHTML = viewLock(); return; }
  if (S.mode === 'setup') { app.innerHTML = viewSetup(); return; }
  if (S.mode === 'login') { app.innerHTML = viewLogin(); return; }
  if (S.mode !== 'app') { app.innerHTML = ''; return; }
  const oldWs = document.querySelector('.wscroll');
  const keep = oldWs ? oldWs.scrollTop : null;
  const active = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.value : null;
  app.innerHTML = `<div class="bar${S.loading > 0 ? ' on' : ''}"></div>` + (S.desk ? deskView() : mobileView()) + sheet();
  if (active !== null) { const q = document.getElementById('q'); if (q) { q.value = active; q.focus(); } }
  if (S.sheet) { const sh = app.querySelector('.sheet'); if (sh) sh.focus({ preventScroll: true }); }
  const n = new Date(), startH = sameDay(S.sel, n) || (S.view === 'week' && mondayOf(n).getTime() === mondayOf(S.sel).getTime()) ? Math.max(0, n.getHours() - 2) : 7;
  if (S.desk) {
    const ws = document.querySelector('.wscroll');
    if (ws) { if (S.scrollDay) ws.scrollTop = startH * HOUR; else if (keep !== null) ws.scrollTop = keep; }
    S.scrollDay = false;
  } else if (S.scrollDay) {
    S.scrollDay = false;
    requestAnimationFrame(() => {
      const tl = document.querySelector('.tl'), st = document.querySelector('.sticky');
      if (!tl) return;
      const y = tl.getBoundingClientRect().top + window.scrollY + startH * HOUR - (st ? st.offsetHeight : 0);
      window.scrollTo(0, Math.max(0, y));
    });
  }
}

/* ---------- klick och tangenter ---------- */
function go() { render(); loadVisible(); }
function selectDay(d) { S.sel = d; S.month = firstOfMonth(d); }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, t = today0(), cv = curView();
  switch (a) {
    case 'pick': {
      const d = parseDate(el.dataset.d);
      if (!S.desk && cv === 'month' && sameDay(d, S.sel)) { S.view = 'day'; S.scrollDay = true; }
      selectDay(d); go(); break;
    }
    case 'dayopen': selectDay(parseDate(el.dataset.d)); S.view = 'day'; S.scrollDay = true; go(); break;
    case 'mpick': {
      selectDay(parseDate(el.dataset.d));
      if (S.view === 'search') S.view = S.backView === 'search' ? 'month' : S.backView;
      if (S.view !== 'month') S.scrollDay = true;
      go(); break;
    }
    case 'mprev': case 'mnext': S.month = new Date(S.month.getFullYear(), S.month.getMonth() + (a === 'mnext' ? 1 : -1), 1); go(); break;
    case 'openday': S.view = 'day'; S.scrollDay = true; go(); break;
    case 'today': selectDay(t); if (S.view === 'search') S.view = S.backView; if (S.view !== 'month') S.scrollDay = true; go(); break;
    case 'prev': case 'next': {
      const k = a === 'next' ? 1 : -1;
      if (cv === 'day') selectDay(addDays(S.sel, k));
      else if (cv === 'week') selectDay(addDays(S.sel, 7 * k));
      else {
        S.month = new Date(S.month.getFullYear(), S.month.getMonth() + k, 1);
        S.sel = (t.getFullYear() === S.month.getFullYear() && t.getMonth() === S.month.getMonth()) ? t : S.month;
      }
      go(); break;
    }
    case 'setview':
      S.view = el.dataset.v;
      if (S.view === 'month') S.month = firstOfMonth(S.sel); else S.scrollDay = true;
      go(); break;
    case 'back': S.view = S.backView === 'search' ? 'month' : S.backView; S.scrollDay = true; go(); break;
    case 'tab':
      S.view = el.dataset.v; S.sheet = null;
      if (S.view === 'day') S.scrollDay = true; else window.scrollTo(0, 0);
      go();
      if (S.view === 'search') setTimeout(() => { const q = document.getElementById('q'); if (q && !S.search.q) q.focus(); }, 50);
      break;
    case 'open': S.sheet = el.dataset.id; render(); break;
    case 'close': S.sheet = null; render(); break;
    case 'gotoday': selectDay(parseDate(el.dataset.d)); S.view = 'day'; S.sheet = null; S.scrollDay = true; go(); break;
    case 'settings': S.sheet = 'settings'; render(); break;
    case 'settheme': setTheme(el.dataset.v); break;
    case 'toggletheme': setTheme(isDark() ? 'light' : 'dark'); break;
    case 'togglecal': {
      const c = S.calendars.find(x => x.id === el.dataset.id);
      if (c) { c.on = !c.on; if (!S.demo) { const vis = store.get('kal_vis', {}); vis[c.id] = c.on; store.set('kal_vis', vis); } }
      render(); break;
    }
    case 'install':
      if (S.installPrompt) { S.installPrompt.prompt(); S.installPrompt.userChoice.finally(() => { S.installPrompt = null; render(); }); }
      break;
    case 'refresh': S.sheet = null; render(); refresh(); break;
    case 'logout': logout(); break;
    case 'lock': lockPage(); break;
    case 'signin': signIn(); break;
    case 'demo': S.demo = true; S.error = ''; startApp(); break;
    case 'exitdemo': exitDemo(); break;
    case 'dismiss': S.error = ''; render(); break;
    case 'add':
      if (S.demo) { ev.preventDefault(); S.error = 'I exempelläget går det inte att lägga till händelser.'; render(); }
      else S.addedAt = Date.now();
      break;
  }
});
document.addEventListener('submit', ev => {
  const lf = ev.target.closest('[data-form="lock"]');
  if (lf) { ev.preventDefault(); const v = lf.t.value.trim(); if (v) unlock(v); return; }
  const f = ev.target.closest('[data-form="search"]');
  if (!f) return;
  ev.preventDefault();
  const q = f.q.value.trim();
  if (q) { f.q.blur(); doSearch(q); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || S.mode !== 'app' || S.demo) return;
  if (Date.now() - S.lastFetch > 120000 || Date.now() - S.addedAt < 1800000) { S.addedAt = 0; refresh(); }
});
deskMQ.addEventListener('change', e => { S.desk = e.matches; if (S.desk) window.scrollTo(0, 0); S.scrollDay = true; render(); });
darkMQ.addEventListener('change', () => { applyTheme(); render(); });
setInterval(() => { if (S.mode === 'app' && (S.view === 'day' || S.view === 'week') && !S.sheet) render(); }, 60000);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installPrompt = e; if (S.sheet === 'settings') render(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- start ---------- */
function boot() {
  S.theme = store.get('kal_theme', 'auto'); applyTheme();
  if (new URLSearchParams(location.search).has('demo')) { S.demo = true; startApp(); return; }
  const gh = store.get('kal_gh', null);
  if (!gh) { S.mode = 'lock'; render(); return; }
  boot2();
  checkGh(gh).then(ok => {
    if (!ok) { store.del('kal_gh'); S.sheet = null; S.mode = 'lock'; S.lockErr = 'Din GitHub-token fungerar inte längre. Klistra in en ny.'; render(); }
  }).catch(() => {});
}
function boot2() {
  if (!hasClientId()) { S.mode = 'setup'; render(); return; }
  const tk = store.get('kal_token', null);
  if (tk && tk.exp > Date.now() + 60000) { S.token = tk.v; S.tokenExp = tk.exp; startApp(); return; }
  S.mode = 'login'; render();
}
boot();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
</body>
